# The workspace's packages. pnpm installs them together, with one lockfile at the root.
packages:
  - api
  - frontend

# Install scripts that pnpm skips. Each one is safe to skip:
# - esbuild's script only repairs a missing binary package and links the binary for a faster start.
#   pnpm installs the binary package for this OS itself, so esbuild works without the script.
# - @parcel/watcher comes in through sass. Its install script only builds from source on request,
#   and the prebuilt binary is a separate package.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
